[package]
name = "pots-server"
version = "0.1.0"
description = "Pots 服務：桌面版內嵌與多設備版共用的 gateway、儲存與 agent run"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pots-server"
path = "src/main.rs"

[dependencies]
pots-proto = { path = "../pots-proto" }
pots-llm = { path = "../pots-llm" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dirs = "6"
futures = "0.3"
gethostname = "1"
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
# 只用執行期檢查的查詢（`sqlx::query`），`macros` 只為了 `sqlx::migrate!` 內嵌 migration。
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid.workspace = true

[dev-dependencies]
pots-llm = { path = "../pots-llm", features = ["test-util"] }
tempfile = "3"
tokio-tungstenite = "0.30"
