[package]
name = "pots-server"
version = "0.1.0"
description = "Pots 服務：桌面版內嵌與多設備版共用的 gateway、儲存與 agent run"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pots-server"
path = "src/main.rs"

# 測試用的假 Claude Code CLI：重播 stream-json 劇本並透過 MCP 呼叫平台工具
# （tests/worker.rs 以 `CARGO_BIN_EXE_pots-fake-claude` 啟動）。不是給使用者的程式。
[[bin]]
name = "pots-fake-claude"
path = "src/bin/pots-fake-claude.rs"
test = false
doc = false

[dependencies]
pots-proto = { path = "../pots-proto" }
pots-llm = { path = "../pots-llm" }
async-trait = "0.1"
# 對話紀錄給 Observer 看時用本機時區（觀察的日期跟著使用者的日子走）。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 排程的 cron 解析與下一次觸發時間（proposal/events-and-automation.md#自我排程）。
croner = "4"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dirs = "6"
futures = "0.3"
gethostname = "1"
getrandom = "0.3"
# GitHub webhook 驗簽（X-Hub-Signature-256）。
hex = "0.4"
hmac = "0.12"
# 中斷 worker 的整個行程群組（本機執行環境）。
libc = "0.2"
# 給 Claude Code worker 的平台工具（proposal/agent-runtime.md#worker-adapter內建-worker-與外部-coding-cli）。
# client 端只有假的 Claude CLI 與測試用。
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
# GitHub REST（輪詢與補漏）；與 pots-llm 用同一個 HTTP client。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
serde.workspace = true
serde_json.workspace = true
# artifact 的版本 diff（proposal/architecture.md#crate-選型）。
similar = "2"
sha2 = "0.10"
# 只用執行期檢查的查詢（`sqlx::query`），`macros` 只為了 `sqlx::migrate!` 內嵌 migration。
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
# agent profile 設定檔（profiles/*.toml）。
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenTelemetry：設 OTEL_EXPORTER_OTLP_ENDPOINT（或 TRACES 版本）才啟用；用 blocking
# client，init_tracing 在 tokio runtime 之前也能建立（桌面版的 --serve）。
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
tracing-opentelemetry = "0.34"
url = "2"
uuid.workspace = true

[dev-dependencies]
pots-llm = { path = "../pots-llm", features = ["test-util"] }
tempfile = "3"
tokio-tungstenite = "0.30"
