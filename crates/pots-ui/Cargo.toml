[package]
name = "pots-ui"
description = "The Pots desktop app (GPUI)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pots"
path = "src/main.rs"

[dependencies]
futures.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui_platform.workspace = true
pots-agent.workspace = true
pots-llm.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# A headless window for driving views with simulated keystrokes in tests.
gpui = { workspace = true, features = ["test-support"] }
