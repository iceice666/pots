[package]
name = "pots-desktop"
version = "0.1.0"
description = "Pots 桌面客戶端（GPUI）"
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit.workspace = true
pots-proto.workspace = true
pots-server = { path = "../pots-server" }
dirs = "6"
gpui-kit-markdown-editor.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = "0.30"
# 圖片附件：驗證 magic number、BMP/TIFF（macOS 截圖、Windows 螢幕剪取）轉 PNG。
# 版本已在 lock（`gpui-pre` 也依賴它），升為一般依賴不會新增版本。
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
# 圖片上傳走 HTTP（`POST /attachments`），不走 WebSocket：大圖塞文字 frame 不理想。
# 服務在本機 loopback，不需要 TLS（與 `ws://` 一致）。
reqwest = { version = "0.13", default-features = false, features = ["query"] }
tracing = "0.1"
# 桌面通知（核准、需要你處理的任務、Goal 完成）；服務沒有視窗，所以由客戶端發出。
notify-rust = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 離屏 renderer 與 HeadlessAppContext。
gpui-kit = { workspace = true, features = ["test-support"] }
pots-llm = { path = "../pots-llm", features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
async-trait = "0.1"
url = "2"

# 用離屏 renderer 把主要畫面存成 PNG：
#   cargo test -p pots-desktop --test screenshots
# 需要 Metal（macOS）或 WGPU（Linux）。
[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
test = false
harness = false
