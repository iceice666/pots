[workspace]
resolver = "3"
members = ["crates/*"]
# 評估用原型各自獨立建置，不併入 workspace。
exclude = ["prototypes"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# GPUI 仍是預發布版，釘精確版本（見 proposal/roadmap-and-decisions.md）。
gpui-kit = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
