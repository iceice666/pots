[workspace]
resolver = "3"
members = ["crates/*"]
# 評估用原型各自獨立建置，不併入 workspace。
exclude = ["prototypes"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# GPUI 仍是預發布版，釘精確版本（見 proposal/roadmap-and-decisions.md）。
gpui-kit = "=0.9.0"
# Artifact 編輯器，評估見 prototypes/gpui-editor。
gpui-kit-markdown-editor = "=0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
pots-proto = { path = "crates/pots-proto" }
