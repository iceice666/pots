[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` at the root launches the app.
default-members = ["crates/pots-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chrono = "0.4.45"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders", "font-kit", "x11", "wayland"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = "0.25"
unicode-segmentation = "1.13.3"
ureq = "3"

pots-llm = { path = "crates/pots-llm" }
pots-agent = { path = "crates/pots-agent" }
pots-mock = { path = "crates/pots-mock" }
